name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: hxlings-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package release artifacts
    uses: ./.github/workflows/ci.yml
    with:
      package: true
      release_version: ${{ github.ref_name }}
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hxlings-*
          path: release
          merge-multiple: true

      - name: Verify release assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          test -n "$release_version"
          test "$release_version" != "$GITHUB_REF_NAME"

          assets=(
            "hxlings-${release_version}-linux-x86_64.tar.gz"
            "hxlings-${release_version}-linux-x86_64.deb"
            "hxlings-${release_version}-linux-x86_64.rpm"
            "hxlings-${release_version}-linux-x86_64.AppImage"
            "hxlings-${release_version}-windows-x86_64.zip"
            "hxlings-${release_version}-windows-x86_64.msi"
            "hxlings-${release_version}-windows-x86_64-setup.exe"
            "hxlings-${release_version}-macos-arm64.tar.gz"
            "hxlings-${release_version}-macos-arm64.dmg"
          )

          for asset in "${assets[@]}"; do
            test -s "release/$asset"
          done

          (cd release && sha256sum "${assets[@]}" > SHA256SUMS.txt)
          ls -lh release
          cat release/SHA256SUMS.txt

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            note_args=(--notes-file "$notes")
          else
            note_args=(--generate-notes)
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Hxlings $GITHUB_REF_NAME" \
              "${note_args[@]}" \
              release/*
          fi
