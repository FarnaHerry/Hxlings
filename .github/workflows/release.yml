name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: hxlings-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package release archives
    uses: ./.github/workflows/ci.yml
    with:
      package: true
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: hxlings-*
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          assets=(hxlings-linux-x86_64.tar.gz hxlings-macos-arm64.tar.gz hxlings-windows-x86_64.zip)
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          printf '%s\n' "${assets[@]}"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(hxlings-linux-x86_64.tar.gz hxlings-macos-arm64.tar.gz hxlings-windows-x86_64.zip)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Hxlings $GITHUB_REF_NAME" --generate-notes
          fi
