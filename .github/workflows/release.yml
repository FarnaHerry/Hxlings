name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: hxlings-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package release artifacts
    uses: ./.github/workflows/ci.yml
    with:
      package: true
      release_version: ${{ github.ref_name }}
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hxlings-*
          path: release
          merge-multiple: true

      - name: Verify release assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          test -n "$release_version"
          test "$release_version" != "$GITHUB_REF_NAME"

          assets=(
            "hxlings-${release_version}-linux-x86_64.tar.xz"
            "hxlings-${release_version}-linux-x86_64.deb"
            "hxlings-${release_version}-linux-x86_64.rpm"
            "hxlings-${release_version}-linux-x86_64.AppImage"
            "hxlings-${release_version}-windows-x86_64.zip"
            "hxlings-${release_version}-windows-x86_64.msi"
            "hxlings-${release_version}-windows-x86_64-setup.exe"
            "hxlings-${release_version}-macos-arm64.tar.xz"
            "hxlings-${release_version}-macos-arm64.dmg"
          )

          for asset in "${assets[@]}"; do
            test -s "release/$asset"
          done

          (cd release && sha256sum "${assets[@]}" > SHA256SUMS.txt)
          ls -lh release
          cat release/SHA256SUMS.txt

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="docs/releases/$GITHUB_REF_NAME.md"
          macos_note=$(printf '%s\n' \
            "" \
            "## macOS Installation & Gatekeeper Notice" \
            "" \
            'The macOS builds are currently ad-hoc signed (`codesign -s -`) without an Apple Developer ID notarization ticket. If macOS Gatekeeper blocks the app on first launch:' \
            "" \
            '- After dragging `Hxlings.app` from `.dmg` to `/Applications`:' \
            '  ```bash' \
            '  xattr -dr com.apple.quarantine /Applications/Hxlings.app' \
            '  ```' \
            '- Or install via Homebrew Cask and clear quarantine once:' \
            '  ```bash' \
            '  brew tap farnaherry/hxlings https://github.com/FarnaHerry/Hxlings' \
            '  brew install --cask farnaherry/hxlings/hxlings' \
            '  xattr -dr com.apple.quarantine /Applications/Hxlings.app' \
            '  ```')

          linux_repo_note=$(printf '%s\n' \
            "" \
            "## Linux RPM / APT Repository" \
            "" \
            'Install and keep `hxlings` updated via the GPG-signed GitHub Pages repository (Fedora / RHEL / openSUSE / Debian / Ubuntu):' \
            "" \
            '```bash' \
            'curl -fsSL https://farnaherry.github.io/Hxlings/setup-repo.sh | sudo bash' \
            '```')

          if [ -f "$notes" ]; then
            merged_notes="$RUNNER_TEMP/release-notes.md"
            cp "$notes" "$merged_notes"
            if ! grep -Fq 'setup-repo.sh' "$merged_notes"; then
              printf '%s\n' "$linux_repo_note" >> "$merged_notes"
            fi
            if ! grep -Fq 'com.apple.quarantine' "$merged_notes"; then
              printf '%s\n' "$macos_note" >> "$merged_notes"
            fi
            note_args=(--notes-file "$merged_notes")
          else
            combined_notes=$(printf '%s\n%s\n' "$linux_repo_note" "$macos_note")
            note_args=(--generate-notes --notes "$combined_notes")
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Hxlings $GITHUB_REF_NAME" \
              "${note_args[@]}" \
              release/*
          fi

  publish-linux-repo:
    name: Publish Linux RPM/APT repository (GitHub Pages)
    needs: [publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-linux-repo.yml
    with:
      tag: ${{ github.ref_name }}
      pkg_name: hxlings
      display_name: Hxlings
    secrets: inherit
