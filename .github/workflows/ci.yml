name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: Build and upload platform release archives and installers
        required: false
        type: boolean
        default: false
      release_version:
        description: Release version override (e.g. v0.1.0 or 0.1.0)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: hxlings-ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MCPP_VERSION: "2026.11.21.1"
  MCPP_LLVM: "llvm@22.1.8"
  XLINGS_NON_INTERACTIVE: "1"

jobs:
  linux:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: hxlings-${{ runner.os }}-${{ runner.arch }}-v1-${{ env.MCPP_VERSION }}-${{ env.MCPP_LLVM }}-${{ hashFiles('mcpp.toml', 'mcpp.lock') }}
          restore-keys: |
            hxlings-${{ runner.os }}-${{ runner.arch }}-v1-${{ env.MCPP_VERSION }}-${{ env.MCPP_LLVM }}-
            hxlings-${{ runner.os }}-${{ runner.arch }}-v1-${{ env.MCPP_VERSION }}-
            hxlings-${{ runner.os }}-${{ runner.arch }}-v1-

      - name: Install xlings
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ] && [ ! -x "$HOME/.xlings/subos/current/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install pinned mcpp
        run: |
          archive="mcpp-${MCPP_VERSION}-linux-x86_64.tar.gz"
          root="$RUNNER_TEMP/mcpp-${MCPP_VERSION}-linux-x86_64"
          mkdir -p "$RUNNER_TEMP" "$HOME/.mcpp/registry"
          curl -L -fsS --retry 5 --retry-all-errors --retry-delay 10 \
            -o "$RUNNER_TEMP/$archive" \
            "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/${archive}"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP_HOME=$HOME/.mcpp" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Select Clang toolchain
        run: |
          mcpp --version
          mcpp toolchain install "${MCPP_LLVM}"
          mcpp toolchain default "${MCPP_LLVM}"
          mcpp toolchain list

      - name: Verify xlings CLI
        run: |
          xlings interface --version
          xlings interface env

      - name: Build (dev)
        run: |
          mcpp build
          bin=$(find target -type f -name hxlings | head -1)
          res=$(find target -path '*hxlings.resources/huxerui/resources.bin' | head -1)
          test -x "$bin"
          test -s "$res"
          echo "built $bin with $res"

      - name: Run tests
        run: mcpp test

      - name: Package release artifacts
        if: inputs.package || github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          raw_ver="${{ inputs.release_version }}"
          if [ -n "$raw_ver" ]; then
            pkg_version="${raw_ver#v}"
          else
            pkg_version=$(python3 -c 'import re; text=open("mcpp.toml").read(); print(re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", text).group(1))')
          fi
          test -n "$pkg_version"

          extract_pack_path() {
            python3 -c 'import sys, json; print(json.load(sys.stdin)["data"]["artifacts"][0]["path"])'
          }

          mkdir -p dist

          tar_out="dist/hxlings-${pkg_version}-linux-x86_64.tar.gz"
          mcpp pack hxlings --release --mode self-contained --pkg-format tar --output "$tar_out"
          test -s "$tar_out"

          tar_repack_dir="$RUNNER_TEMP/hxlings-tar-repack"
          rm -rf "$tar_repack_dir" && mkdir -p "$tar_repack_dir"
          tar -xzf "$tar_out" -C "$tar_repack_dir"
          tar_top=$(find "$tar_repack_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -d "$tar_top"
          for launcher in "$tar_top/hxlings" "$tar_top/run.sh"; do
            if [ -f "$launcher" ]; then
              python3 -c 'import pathlib, sys; p = pathlib.Path(sys.argv[1]); old = "--library-path \"$here/lib\""; new = "--library-path \"$here/lib:/usr/lib/x86_64-linux-gnu:/usr/lib64:/lib/x86_64-linux-gnu:/lib64\""; text = p.read_text(); assert old in text, f"missing expected library-path flag in {p}"; p.write_text(text.replace(old, new))' "$launcher"
              chmod +x "$launcher"
            fi
          done
          tar -C "$tar_repack_dir" -czf "$tar_out" "$(basename "$tar_top")"

          tar_list=$(tar -tzf "$tar_out")
          printf '%s\n' "$tar_list" | grep -q 'hxlings.resources/huxerui/resources.bin'
          printf '%s\n' "$tar_list" | grep -q 'hxlings\.resources/huxerui/app/images/hxlings\.png'
          printf '%s\n' "$tar_list" | grep -q 'hxlings\.resources/huxerui/app/images/tray_icon\.png'
          printf '%s\n' "$tar_list" | grep -q 'dropdown_indicator\.huxv'
          printf '%s\n' "$tar_list" | grep -q 'lib/ld-linux-x86-64\.so\.2'
          printf '%s\n' "$tar_list" | grep -q 'lib/libc\.so\.6'
          printf '%s\n' "$tar_list" | grep -q 'lib/libm\.so\.6'
          printf '%s\n' "$tar_list" | grep -q 'lib/gconv/'

          grep -q 'MCPP_BUNDLE_DIR' "$tar_top/hxlings"
          grep -q 'ld-linux-x86-64.so.2' "$tar_top/hxlings"
          grep -Fq '/usr/lib/x86_64-linux-gnu:/usr/lib64' "$tar_top/hxlings"
          ldd_out=$("$tar_top/lib/ld-linux-x86-64.so.2" --library-path "$tar_top/lib:/usr/lib/x86_64-linux-gnu:/usr/lib64:/lib/x86_64-linux-gnu:/lib64" --list "$tar_top/bin/hxlings")
          ! printf '%s\n' "$ldd_out" | grep -q 'not found'
          printf '%s\n' "$ldd_out" | grep -E 'libc\.so\.6 => ' | grep -Fq "$tar_top/"
          printf '%s\n' "$ldd_out" | grep -E 'libm\.so\.6 => ' | grep -Fq "$tar_top/"
          printf '%s\n' "$ldd_out" | grep -E 'libgtk-4\.so\.1 => ' | grep -Fq "$tar_top/"
          rm -rf "$tar_repack_dir"

          deb_src=$(mcpp pack hxlings --release --mode system --pkg-format deb --message-format json | extract_pack_path)
          test -s "$deb_src"
          deb_out="dist/hxlings-${pkg_version}-linux-x86_64.deb"
          cp "$deb_src" "$deb_out"
          dpkg-deb -I "$deb_out"
          deb_depends=$(dpkg-deb -f "$deb_out" Depends)
          echo "$deb_depends" | grep -Fq 'libgtk-4-1 (>= 4.14)'
          echo "$deb_depends" | grep -Fq 'libepoxy0 (>= 1.5)'
          echo "$deb_depends" | grep -Fq 'libsoup-3.0-0 (>= 3.0)'
          deb_list=$(dpkg-deb -c "$deb_out")
          echo "$deb_list" | grep -q '/usr/bin/hxlings'
          echo "$deb_list" | grep -q 'hxlings\.resources/huxerui/resources\.bin'
          echo "$deb_list" | grep -q 'hxlings\.resources/huxerui/app/images/hxlings\.png'
          echo "$deb_list" | grep -q 'hxlings\.resources/huxerui/app/images/tray_icon\.png'
          echo "$deb_list" | grep -q '/usr/share/applications/hxlings\.desktop'
          echo "$deb_list" | grep -q '/usr/share/icons/hicolor/scalable/apps/hxlings\.svg'
          ! printf '%s\n' "$deb_list" | grep -Eq 'lib/(libc|libgtk-4)\.so'

          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "./$deb_out"
          ! readelf -V /opt/hxlings/bin/hxlings | grep -Eq 'GLIBC_2\.(39|4[0-9])'
          sys_ldd=$(/usr/bin/ldd /opt/hxlings/bin/hxlings)
          ! printf '%s\n' "$sys_ldd" | grep -qiE 'not found|version .* not found'
          printf '%s\n' "$sys_ldd" | grep -E 'libgtk-4\.so\.1 => /(usr/)?lib'

          rpm_src=$(mcpp pack hxlings --release --mode system --pkg-format rpm --message-format json | extract_pack_path)
          test -s "$rpm_src"
          rpm_out="dist/hxlings-${pkg_version}-linux-x86_64.rpm"
          cp "$rpm_src" "$rpm_out"
          file "$rpm_out" | grep -q 'RPM'
          test "$(stat -c%s "$rpm_out")" -lt 15000000
          rpm_nfpm="$(dirname "$rpm_src")/linux-package/rpm/nfpm.yaml"
          test -f "$rpm_nfpm"
          grep -Fq 'libgtk-4.so.1()(64bit)' "$rpm_nfpm"
          ! grep -Eq 'lib/(libc|libgtk-4)\.so' "$rpm_nfpm"

          app_src=$(mcpp pack hxlings --release --mode self-contained --pkg-format appimage --message-format json | extract_pack_path)
          test -s "$app_src"
          app_out="dist/hxlings-${pkg_version}-linux-x86_64.AppImage"
          cp "$app_src" "$app_out"
          chmod +x "$app_out"
          file "$app_out" | grep -qiE 'ELF|AppImage'
          app_check_dir="$RUNNER_TEMP/hxlings-appimage-check"
          rm -rf "$app_check_dir" && mkdir -p "$app_check_dir"
          (cd "$app_check_dir" && "$OLDPWD/$app_out" --appimage-extract >/dev/null)
          test -f "$app_check_dir/squashfs-root/lib/ld-linux-x86-64.so.2"
          test -f "$app_check_dir/squashfs-root/lib/libc.so.6"
          test -f "$app_check_dir/squashfs-root/lib/libm.so.6"
          test -s "$app_check_dir/squashfs-root/bin/hxlings.resources/huxerui/resources.bin"
          grep -q 'MCPP_BUNDLE_DIR' "$app_check_dir/squashfs-root/hxlings"
          grep -Fq '/usr/lib/x86_64-linux-gnu:/usr/lib64' "$app_check_dir/squashfs-root/hxlings"
          rm -rf "$app_check_dir"

          ls -lh dist

      - name: Upload release artifacts
        if: inputs.package || github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hxlings-linux-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macos-arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: hxlings-${{ runner.os }}-${{ runner.arch }}-v1-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml', 'mcpp.lock') }}
          restore-keys: |
            hxlings-${{ runner.os }}-${{ runner.arch }}-v1-${{ env.MCPP_VERSION }}-
            hxlings-${{ runner.os }}-${{ runner.arch }}-v1-

      - name: Install xlings
        run: |
          if [ ! -x "$HOME/.xlings/bin/xlings" ] && [ ! -x "$HOME/.xlings/subos/current/bin/xlings" ]; then
            curl -fsSL https://d2learn.org/xlings-install.sh | bash
          fi
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install pinned mcpp
        run: |
          archive="mcpp-${MCPP_VERSION}-macosx-arm64.tar.gz"
          root="$RUNNER_TEMP/mcpp-${MCPP_VERSION}-macosx-arm64"
          mkdir -p "$RUNNER_TEMP" "$HOME/.mcpp/registry"
          curl -L -fsS --retry 5 --retry-all-errors --retry-delay 10 \
            -o "$RUNNER_TEMP/$archive" \
            "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/${archive}"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          cp -R "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP_HOME=$HOME/.mcpp" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Verify mcpp and xlings
        run: |
          mcpp --version
          xlings interface --version
          xlings interface env

      - name: Build (dev)
        run: |
          mcpp build
          bin=$(find target -type f -name hxlings | head -1)
          res=$(find target \( -path '*hxlings.resources/huxerui/resources.bin' -o -path '*HuxerUI/huxerui/resources.bin' \) | head -1)
          test -x "$bin"
          test -s "$res"
          echo "built $bin with $res"

      - name: Run tests
        run: mcpp test

      - name: Package release artifacts
        if: inputs.package || github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          raw_ver="${{ inputs.release_version }}"
          if [ -n "$raw_ver" ]; then
            pkg_version="${raw_ver#v}"
          else
            pkg_version=$(python3 -c 'import re; text=open("mcpp.toml").read(); print(re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", text).group(1))')
          fi
          test -n "$pkg_version"

          extract_pack_path() {
            python3 -c 'import sys, json; print(json.load(sys.stdin)["data"]["artifacts"][0]["path"])'
          }

          ruby -c Casks/hxlings.rb

          mkdir -p dist

          tar_out="dist/hxlings-${pkg_version}-macos-arm64.tar.gz"
          mcpp pack hxlings --release --pkg-format tar --output "$tar_out"
          test -s "$tar_out"
          tar_list=$(tar -tzf "$tar_out")
          printf '%s\n' "$tar_list" | grep -Eq '(hxlings\.resources|HuxerUI)/huxerui/resources\.bin'
          printf '%s\n' "$tar_list" | grep -q 'huxerui/app/images/hxlings\.png'
          printf '%s\n' "$tar_list" | grep -q 'huxerui/app/images/tray_icon\.png'
          printf '%s\n' "$tar_list" | grep -q 'dropdown_indicator\.huxv'

          tar_check_dir="$RUNNER_TEMP/hxlings-macos-tar-check"
          rm -rf "$tar_check_dir" && mkdir -p "$tar_check_dir"
          tar -xzf "$tar_out" -C "$tar_check_dir"
          tar_bin=$(find "$tar_check_dir" -type f -path '*/bin/hxlings' | head -n 1)
          test -x "$tar_bin"
          codesign --verify --strict --verbose=2 "$tar_bin"
          rm -rf "$tar_check_dir"

          dmg_src=$(mcpp pack hxlings --release --pkg-format dmg --message-format json | extract_pack_path)
          test -s "$dmg_src"
          dmg_out="dist/hxlings-${pkg_version}-macos-arm64.dmg"
          cp "$dmg_src" "$dmg_out"
          hdiutil verify "$dmg_out"

          dmg_mount="$RUNNER_TEMP/hxlings-dmg-mount"
          cleanup_dmg_mount() {
            if [ -d "$dmg_mount" ]; then
              hdiutil detach "$dmg_mount" -quiet || hdiutil detach "$dmg_mount" -force -quiet || true
              rmdir "$dmg_mount" 2>/dev/null || rm -rf "$dmg_mount"
            fi
          }
          trap cleanup_dmg_mount EXIT
          cleanup_dmg_mount
          mkdir -p "$dmg_mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$dmg_mount" "$dmg_out" >/dev/null
          test -d "$dmg_mount/Hxlings.app"
          test -L "$dmg_mount/Applications"
          test -x "$dmg_mount/Hxlings.app/Contents/MacOS/hxlings"
          test -s "$dmg_mount/Hxlings.app/Contents/Info.plist"
          test -s "$dmg_mount/Hxlings.app/Contents/Resources/AppIcon.icns"
          test -s "$dmg_mount/Hxlings.app/Contents/Resources/HuxerUI/huxerui/resources.bin" || \
            test -s "$dmg_mount/Hxlings.app/Contents/Resources/hxlings.resources/huxerui/resources.bin"
          codesign --verify --deep --strict --verbose=2 "$dmg_mount/Hxlings.app"
          codesign -dvv "$dmg_mount/Hxlings.app" 2>&1
          cleanup_dmg_mount
          trap - EXIT

          ls -lh dist

      - name: Upload release artifacts
        if: inputs.package || github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hxlings-macos-arm64
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows-x86_64
    # Pinned to windows-2022: windows-latest MSVC STL 14.51 breaks huxerui under Clang
    # (std::_Find_vectorized static_assert on NodeExtensionHandle).
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Cache xlings and mcpp
        uses: actions/cache@v4
        with:
          path: |
            ~/.xlings
            ~/.mcpp
          key: hxlings-${{ runner.os }}-${{ runner.arch }}-v1-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml', 'mcpp.lock') }}
          restore-keys: |
            hxlings-${{ runner.os }}-${{ runner.arch }}-v1-${{ env.MCPP_VERSION }}-
            hxlings-${{ runner.os }}-${{ runner.arch }}-v1-

      - name: Install xlings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$HOME\.xlings\bin\xlings.exe") -and -not (Test-Path "$HOME\.xlings\subos\current\bin\xlings.exe")) {
            irm https://d2learn.org/xlings-install.ps1.txt | iex
          }
          "$HOME\.xlings\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$HOME\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install pinned mcpp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "mcpp-$($env:MCPP_VERSION)-windows-x86_64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $archive
          $root = Join-Path $env:RUNNER_TEMP "mcpp-$($env:MCPP_VERSION)-windows-x86_64"
          $mcppHome = Join-Path $HOME ".mcpp"
          $regDest = Join-Path $mcppHome "registry"
          New-Item -ItemType Directory -Path $regDest -Force | Out-Null
          curl.exe -L -fsS --retry 5 --retry-all-errors --retry-delay 10 -o $zipPath "https://github.com/mcpp-community/mcpp/releases/download/v$($env:MCPP_VERSION)/$archive"
          Expand-Archive -Force -Path $zipPath -DestinationPath $env:RUNNER_TEMP
          Copy-Item -Path (Join-Path $root "registry\*") -Destination $regDest -Recurse -Force
          "MCPP_HOME=$mcppHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $root "bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify mcpp and xlings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mcpp --version
          xlings interface --version
          xlings interface env

      - name: Build (dev)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mcpp build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem -Path target -Recurse -Filter 'hxlings.exe' | Select-Object -First 1
          if (-not $exe) { throw 'hxlings.exe not found' }
          $res = Join-Path $exe.Directory.FullName 'hxlings.resources\huxerui\resources.bin'
          if (-not (Test-Path $res)) { throw "missing $res" }
          Write-Host "built $($exe.FullName) with $res"

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mcpp test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release artifacts
        if: inputs.package || github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --list-runtimes

          $rawVer = '${{ inputs.release_version }}'
          if (-not [string]::IsNullOrWhiteSpace($rawVer)) {
            $pkgVersion = $rawVer.TrimStart('v')
          } else {
            $toml = Get-Content 'mcpp.toml' -Raw
            if ($toml -match '(?m)^version\s*=\s*"([^"]+)"') {
              $pkgVersion = $Matches[1]
            }
          }
          if (-not $pkgVersion) { throw 'Failed to resolve package version' }

          New-Item -ItemType Directory -Path dist -Force | Out-Null

          $installerZip = Join-Path $env:RUNNER_TEMP 'hxlings-installer.zip'
          $installerExtract = Join-Path $env:RUNNER_TEMP 'hxlings-installer-stage'
          if (Test-Path $installerExtract) { Remove-Item -Recurse -Force $installerExtract }
          Push-Location 'platform/windows/package'
          try {
            mcpp pack hxlings-installer --release --pkg-format zip --output $installerZip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          Expand-Archive -Force -Path $installerZip -DestinationPath $installerExtract
          $installerExe = Get-ChildItem -Path $installerExtract -Recurse -Filter 'hxlings-installer.exe' | Select-Object -First 1
          if (-not $installerExe) { throw "hxlings-installer.exe not found in $installerExtract" }
          $installerDir = $installerExe.Directory.FullName
          foreach ($req in @('mbanative.dll', 'VCRUNTIME140.dll', 'MSVCP140.dll', 'hxlings-installer.resources\huxerui\resources.bin')) {
            $full = Join-Path $installerDir $req
            if (-not (Test-Path $full -PathType Leaf)) { throw "missing custom installer asset: $full" }
          }
          $env:HXLINGS_WINDOWS_INSTALLER_DIR = $installerDir
          Write-Host "Staged HuxerUI Windows installer UI at $installerDir"

          $zipOut = "dist/hxlings-$pkgVersion-windows-x86_64.zip"
          mcpp pack hxlings --release --pkg-format zip --output $zipOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $zipOut -PathType Leaf) -or (Get-Item $zipOut).Length -le 0) {
            throw "missing or empty $zipOut"
          }

          $setupJsonRaw = mcpp pack hxlings --release --pkg-format setup --message-format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setupJson = ($setupJsonRaw -join "`n") | ConvertFrom-Json
          $setupSrc = [string]$setupJson.data.artifacts[0].path
          if (-not $setupSrc -or -not (Test-Path $setupSrc -PathType Leaf)) {
            throw "mcpp pack --pkg-format setup did not produce an exe: $setupSrc"
          }
          $setupOut = "dist/hxlings-$pkgVersion-windows-x86_64-setup.exe"
          Copy-Item -Path $setupSrc -Destination $setupOut -Force

          $msiCandidate = [System.IO.Path]::ChangeExtension($setupSrc, '.msi')
          if (-not (Test-Path $msiCandidate -PathType Leaf)) {
            $msiJsonRaw = mcpp pack hxlings --release --pkg-format msi --message-format json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $msiJson = ($msiJsonRaw -join "`n") | ConvertFrom-Json
            $msiCandidate = [string]$msiJson.data.artifacts[0].path
          }
          if (-not $msiCandidate -or -not (Test-Path $msiCandidate -PathType Leaf)) {
            throw "MSI not found beside bundle or via --pkg-format msi: $msiCandidate"
          }
          $msiOut = "dist/hxlings-$pkgVersion-windows-x86_64.msi"
          Copy-Item -Path $msiCandidate -Destination $msiOut -Force

          $msiLength = (Get-Item $msiOut).Length
          if ($msiLength -lt 2MB) {
            throw "MSI is implausibly small ($msiLength bytes); CAB may not be embedded"
          }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @((Resolve-Path $msiOut).Path, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @('SELECT FileName, FileSize FROM File'))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
          $files = @()
          while ($true) {
            $row = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
            if (-not $row) { break }
            $name = $row.GetType().InvokeMember('StringData', 'GetProperty', $null, $row, @(1))
            $size = $row.GetType().InvokeMember('IntegerData', 'GetProperty', $null, $row, @(2))
            $files += [pscustomobject]@{ Name = $name; Size = $size }
          }
          if ($files.Count -eq 0) { throw 'the MSI File table is empty' }
          $exeEntry = $files | Where-Object { $_.Name -like '*hxlings.exe*' } | Select-Object -First 1
          if (-not $exeEntry) { throw 'the MSI does not carry hxlings.exe' }
          if ($exeEntry.Size -lt 1MB) { throw "the MSI hxlings.exe is implausibly small ($($exeEntry.Size) bytes)" }
          if (-not ($files | Where-Object { $_.Name -like '*resources.bin*' })) {
            throw 'the MSI does not carry huxerui/resources.bin'
          }
          if (-not ($files | Where-Object { $_.Name -like '*hxlings.png*' })) {
            throw 'the MSI does not carry huxerui/app/images/hxlings.png'
          }
          if (-not ($files | Where-Object { $_.Name -like '*tray_icon.png*' })) {
            throw 'the MSI does not carry huxerui/app/images/tray_icon.png'
          }

          $mediaView = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @('SELECT Cabinet FROM Media'))
          $mediaView.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $mediaView, $null)
          $cabinets = @()
          while ($true) {
            $row = $mediaView.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $mediaView, $null)
            if (-not $row) { break }
            $cab = $row.GetType().InvokeMember('StringData', 'GetProperty', $null, $row, @(1))
            if (-not [string]::IsNullOrWhiteSpace($cab)) { $cabinets += $cab }
          }
          if ($cabinets.Count -eq 0) { throw 'MSI Media table has no Cabinet entries' }
          foreach ($cab in $cabinets) {
            if (-not $cab.StartsWith('#')) {
              throw "MSI Media.Cabinet '$cab' is external (expected embedded '#...')"
            }
          }

          $shortcutView = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @('SELECT Shortcut FROM Shortcut'))
          $shortcutView.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $shortcutView, $null)
          $shortcuts = @()
          while ($true) {
            $row = $shortcutView.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $shortcutView, $null)
            if (-not $row) { break }
            $shortcuts += $row.GetType().InvokeMember('StringData', 'GetProperty', $null, $row, @(1))
          }
          if (-not ($shortcuts -contains 'ApplicationStartMenuShortcut')) { throw 'missing ApplicationStartMenuShortcut' }
          if (-not ($shortcuts -contains 'ApplicationDesktopShortcutLink')) { throw 'missing ApplicationDesktopShortcutLink' }

          $propView = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property = 'ARPPRODUCTICON'"))
          $propView.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $propView, $null)
          $propRow = $propView.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $propView, $null)
          if (-not $propRow) { throw 'missing ARPPRODUCTICON property' }
          $arpIcon = $propRow.GetType().InvokeMember('StringData', 'GetProperty', $null, $propRow, @(1))
          if ($arpIcon -ne 'ApplicationIcon') { throw "unexpected ARPPRODUCTICON value: $arpIcon" }

          foreach ($comObj in @($propRow, $propView, $shortcutView, $mediaView, $view, $db, $installer)) {
            if ($comObj -ne $null) {
              [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($comObj)
            }
          }

          $adminTestRoot = Join-Path $env:RUNNER_TEMP 'msi-isolated-check'
          if (Test-Path $adminTestRoot) { Remove-Item -Recurse -Force $adminTestRoot }
          $isoMsiDir = Join-Path $adminTestRoot 'msi'
          $adminDir = Join-Path $adminTestRoot 'extract'
          New-Item -ItemType Directory -Path $isoMsiDir, $adminDir -Force | Out-Null
          $isolatedMsi = Join-Path $isoMsiDir (Split-Path -Leaf $msiOut)
          Copy-Item -Path $msiOut -Destination $isolatedMsi -Force
          $msiProc = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/a', $isolatedMsi, '/qn', "TARGETDIR=$adminDir") -Wait -PassThru -NoNewWindow
          if ($msiProc.ExitCode -ne 0) {
            throw "standalone msiexec /a failed with exit code $($msiProc.ExitCode)"
          }
          $extractedExe = Get-ChildItem -Path $adminDir -Recurse -Filter 'hxlings.exe' | Select-Object -First 1
          if (-not $extractedExe -or $extractedExe.Length -lt 1MB) {
            throw "standalone MSI extraction missing valid hxlings.exe under $adminDir"
          }
          foreach ($rel in @('VCRUNTIME140.dll', 'MSVCP140.dll', 'hxlings.resources\huxerui\resources.bin', 'hxlings.resources\huxerui\app\images\hxlings.png', 'hxlings.resources\huxerui\app\images\tray_icon.png')) {
            $p = Join-Path $extractedExe.Directory.FullName $rel
            if (-not (Test-Path $p -PathType Leaf)) {
              throw "standalone MSI extraction missing $p"
            }
          }
          Write-Host "Verified standalone MSI extraction ($($extractedExe.Directory.FullName))"

          $setupLength = (Get-Item $setupOut).Length
          if ($setupLength -le ($msiLength + 1MB)) {
            throw "setup.exe ($setupLength) should be larger than chained MSI ($msiLength) + 1MB"
          }

          $wixExe = Get-ChildItem -Path $env:MCPP_HOME -Recurse -Filter 'wix.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wixExe) { throw "wix.exe not found under $($env:MCPP_HOME)" }
          $burnOut = Join-Path $env:RUNNER_TEMP 'burn-extract-check'
          if (Test-Path $burnOut) { Remove-Item -Recurse -Force $burnOut }
          $burnAttached = Join-Path $burnOut 'Attached'
          $burnUx = Join-Path $burnOut 'UX'
          & $wixExe.FullName burn extract (Resolve-Path $setupOut).Path -out $burnAttached -outba $burnUx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $baExe = Get-ChildItem -Path $burnUx -Recurse -Filter 'hxlings-installer.exe' | Select-Object -First 1
          if (-not $baExe -or $baExe.Length -lt 1MB) {
            throw "Burn UX container missing valid hxlings-installer.exe under $burnUx"
          }
          foreach ($rel in @('mbanative.dll', 'VCRUNTIME140.dll', 'MSVCP140.dll', 'hxlings-installer.resources\huxerui\resources.bin', 'hxlings-installer.resources\huxerui\installer\images\hxlings.png')) {
            $p = Join-Path $baExe.Directory.FullName $rel
            if (-not (Test-Path $p -PathType Leaf)) {
              throw "Burn UX container missing $p"
            }
          }
          $baData = Get-ChildItem -Path $burnUx -Recurse -Filter 'BootstrapperApplicationData.xml' | Select-Object -First 1
          if ($baData) {
            $baXml = Get-Content $baData.FullName -Raw
            if ($baXml -match 'WixStandardBootstrapperApplication') {
              throw 'Burn bundle unexpectedly references WixStandardBootstrapperApplication'
            }
          }
          Write-Host "Verified Burn custom HuxerUI BA ($($baExe.FullName), $($baExe.Length) bytes)"

          Get-Item dist/* | Format-Table Name, Length

      - name: Upload release artifacts
        if: inputs.package || github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hxlings-windows-x86_64
          path: dist/*
          if-no-files-found: error
