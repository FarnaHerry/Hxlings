[package]
name        = "hxlings"
version     = "0.1.5"
standard    = "c++23"
description = "Desktop GUI manager for xlings built with mcpp and HuxerUI"
license     = "MIT"
repo        = "https://github.com/FarnaHerry/Hxlings"
authors     = ["FarnaHerry <FarnaHerry@users.noreply.github.com>"]
platforms   = ["linux", "windows", "macos"]

[package.metadata.huxerui]
name      = "Hxlings"
id        = "io.github.farnaherry.hxlings"
resources = "resources"

[resources]
icon = "platform/windows/app.ico"

[dependencies.huxerui]
huxerui = { git = "https://github.com/HuxerUI/HuxerUI.git", branch = "main" }

[dependencies.mcpplibs]
os = "0.4.5"

[dependencies.nlohmann]
json = "3.12.0"

[build-dependencies.mcpp]
plugins = { version = "0.26.1", features = ["dist-wix"], host-module = true }

[targets.hxlings]
kind              = "app"
main              = "src/main.cpp"
windows_subsystem = "windows"
windows_entry     = "main"

[build]
sources = []
