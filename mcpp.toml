[package]
name        = "hxlings"
version     = "0.1.0"
standard    = "c++23"
description = "Desktop GUI manager for xlings built with mcpp and HuxerUI"
license     = "MIT"
repo        = "https://github.com/FarnaHerry/Hxlings"
authors     = ["FarnaHerry <FarnaHerry@users.noreply.github.com>"]
platforms   = ["linux", "windows", "macos"]

[package.metadata.huxerui]
name = "Hxlings"
id   = "io.github.farnaherry.hxlings"

[dependencies.huxerui]
huxerui = { git = "https://github.com/Sunrisepeak/HuxerUI.git", branch = "feat/build-system-contract-mcpp" }

[dependencies.nlohmann]
json = "3.12.0"

[targets.hxlings]
kind = "bin"
main = "src/main.cpp"

[build]
sources = []
